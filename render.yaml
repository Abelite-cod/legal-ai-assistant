services:
  - type: web
    name: legal-ai-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

    # Environment variables — set GOOGLE_API_KEY in the Render dashboard
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # You will paste the value in the Render dashboard

      - key: DATABASE_URL
        value: sqlite:///./legal_ai.db   # swap for a Render PostgreSQL URL if you add a DB

      - key: PORT
        value: 8000

    # Persistent disk so uploaded PDFs and ChromaDB survive redeploys
    disk:
      name: legal-ai-data
      mountPath: /app/data
      sizeGB: 1

    healthCheckPath: /health
